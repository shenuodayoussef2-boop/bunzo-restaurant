<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الكاشير الاحترافية - Resto System</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #090d16; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: 280px; background-color: #111827; border-left: 1px solid #1f2937; display: flex; flex-direction: column; padding: 25px; }
    .sidebar h2 { color: #3b82f6; font-size: 20px; margin-bottom: 30px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .menu { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .menu li a { color: #9ca3af; text-decoration: none; padding: 12px 15px; border-radius: 10px; display: flex; align-items: center; gap: 12px; transition: 0.3s; font-weight: 600; }
    .menu li.active a, .menu li a:hover { background-color: #1f2937; color: #3b82f6; }

    .main-content { flex: 1; padding: 35px; overflow-y: auto; background-color: #090d16; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1f2937; padding-bottom: 15px; }
    .header h1 { font-size: 22px; color: #fff; }
    .user-badge { background: #1f2937; padding: 6px 15px; border-radius: 20px; font-size: 13px; color: #3b82f6; border: 1px solid #374151; font-weight: bold; }

    .section-box { background-color: #111827; border-radius: 16px; padding: 25px; border: 1px solid #1f2937; margin-bottom: 25px; }
    .section-box h3 { margin-bottom: 20px; font-size: 18px; color: #f3f4f6; display: flex; align-items: center; gap: 10px; }

    .add-form { display: flex; gap: 10px; margin-bottom: 20px; background: #090d16; padding: 15px; border-radius: 10px; border: 1px solid #1f2937; flex-wrap: wrap; }
    .add-form input { flex: 1; min-width: 140px; padding: 12px; background: #111827; border: 1px solid #374151; color: #fff; border-radius: 8px; outline: none; }
    .add-form button { background: #3b82f6; color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }

    table { width: 100%; border-collapse: collapse; text-align: right; }
    th, td { padding: 14px; border-bottom: 1px solid #1f2937; font-size: 14px; }
    th { color: #9ca3af; font-weight: 600; }
    
    .assign-select { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 8px; border-radius: 6px; outline: none; }
    .assign-btn { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .assign-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2><i class="fa-solid fa-cash-register"></i> نقاط البيع (POS)</h2>
    <ul class="menu">
      <li class="active"><a href="cashier.html"><i class="fa-solid fa-receipt"></i> تسجيل الأوردرات</a></li>
      <li><a href="delivery.html" target="_blank"><i class="fa-solid fa-motorcycle"></i> معاينة لوحة الدليفري</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="header">
      <h1>إدارة وتسجيل الطلبات الجديدة</h1>
      <span class="user-badge">الكاشير: نشط</span>
    </div>

    <div class="section-box">
      <h3><i class="fa-solid fa-cart-plus" style="color: #3b82f6;"></i> إضافة أوردر جديد للعميل</h3>
      <div class="add-form">
        <input type="text" id="clientName" placeholder="اسم العميل...">
        <input type="text" id="clientAddress" placeholder="عنوان التوصيل (الشارع / المنطقة)...">
        <input type="text" id="orderTotal" placeholder="الإجمالي (مثال: 250 ج.م)">
        <button onclick="addNewOrder()">إضافة أوردر ➔</button>
      </div>

      <h3><i class="fa-solid fa-list-check" style="color: #3b82f6;"></i> الأوردرات الحالية وإسنادها للدليفري</h3>
      <table>
        <thead>
          <tr>
            <th>رقم الأوردر</th>
            <th>بيانات العميل والعنوان</th>
            <th>الإجمالي</th>
            <th>اختر كابتن الدليفري</th>
            <th>إجراء الإرسال</th>
          </tr>
        </thead>
        <tbody id="cashierTableBody">
          <!-- الأوردرات بتظهر هنا -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // جلب الأوردرات المخزنة أو البدء بقائمة فارغة
    let orders = JSON.parse(localStorage.getItem('restaurantOrders')) || [
      { id: '101', name: 'محمود حسن', address: 'شارع الهرم، الجيزة', total: '320 ج.م' }
    ];

    function renderCashierTable() {
      const tbody = document.getElementById('cashierTableBody');
      tbody.innerHTML = '';

      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#9ca3af;">لا توجد أوردرات حالياً</td></tr>`;
        return;
      }

      orders.forEach((order, index) => {
        tbody.innerHTML += `
          <tr>
            <td>#${order.id}</td>
            <td>${order.name}<br><small style="color:#9ca3af;">${order.address}</small></td>
            <td>${order.total}</td>
            <td>
              <select class="assign-select" id="driver-${order.id}">
                <option value="كابتن أحمد">كابتن أحمد</option>
                <option value="كابتن محمود">كابتن محمود</option>
                <option value="كابتن إبراهيم">كابتن إبراهيم</option>
              </select>
            </td>
            <td><button class="assign-btn" onclick="sendToDelivery(${index})">إسناد وتوصيل ➔</button></td>
          </tr>
        `;
      });
    }

    function addNewOrder() {
      const name = document.getElementById('clientName').value;
      const address = document.getElementById('clientAddress').value;
      const total = document.getElementById('orderTotal').value;

      if(!name || !address || !total) {
        alert('برجاء إدخال كافة بيانات العميل!');
        return;
      }

      const newOrder = {
        id: Math.floor(100 + Math.random() * 900),
        name: name,
        address: address,
        total: total
      };

      orders.push(newOrder);
      localStorage.setItem('restaurantOrders', JSON.stringify(orders));
      renderCashierTable();

      document.getElementById('clientName').value = '';
      document.getElementById('clientAddress').value = '';
      document.getElementById('orderTotal').value = '';
    }

    function sendToDelivery(index) {
      const order = orders[index];
      const selectElement = document.getElementById(`driver-${order.id}`);
      const selectedDriver = selectElement.value;

      // إضافة اسم الدليفري لبيانات الأوردر
      order.driver = selectedDriver;

      // حفظ الأوردرات المسندة في قائمة خاصة بالدليفري
      let deliveryList = JSON.parse(localStorage.getItem('deliveryQueue')) || [];
      deliveryList.push(order);
      localStorage.setItem('deliveryQueue', JSON.stringify(deliveryList));

      // حذف الأوردر من قائمة الكاشير
      orders.splice(index, 1);
      localStorage.setItem('restaurantOrders', JSON.stringify(orders));

      renderCashierTable();
      alert(`تم إرسال الأوردر بنجاح إلى (${selectedDriver}) وسيظهر في لوحته فوراً!`);
    }

    window.onload = renderCashierTable;
  </script>
</body>
</html>
