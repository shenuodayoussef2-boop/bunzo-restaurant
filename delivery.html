<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الدليفري - Resto System</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background-color: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; }
    .sidebar h2 { color: #10b981; font-size: 20px; margin-bottom: 30px; text-align: center; }
    .menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .menu li a { color: #94a3b8; text-decoration: none; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; font-weight: 600; }
    .menu li.active a { background-color: #10b981; color: #fff; }
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
    .order-card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .done-btn { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2><i class="fa-solid fa-motorcycle"></i> الدليفري</h2>
    <ul class="menu">
      <li class="active"><a href="#"><i class="fa-solid fa-box"></i> الطلبات المخصصة لي</a></li>
      <li><a href="index.html" style="color: #ef4444; margin-top: 40px;"><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج</a></li>
    </ul>
  </div>
  <div class="main-content">
    <div class="header">
      <h1>طلبات التوصيل الجاهزة</h1>
      <span>كابتن / أحمد</span>
    </div>
    <div class="card">
      <h3>الطلبات المطلوب توصيلها الآن</h3>
      <br>
      <div class="order-card">
        <div>
          <p><strong>رقم الأوردر:</strong> #101</p>
          <p><strong>العنوان:</strong> 15 شارع الهرم، الجيزة</p>
          <p><strong>المبلغ المطلوب تحصيله:</strong> 360 ج.م</p>
        </div>
        <button class="done-btn" onclick="this.parentElement.style.opacity='0.5'; alert('تم تسجيل الأوردر بنجاح!');">تم التوصيل ✓</button>
      </div>
    </div>
  </div>
</body>
</html>
